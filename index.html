<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microduck</title>
<style>
/* Microduck: l'interfaccia. Gira nella finestra nativa (trasparente, sempre sopra) oppure, per le prove,
   aperta in un browser qualunque: senza la finestra usa dati finti. Parametri di prova:
   ?ora=18:31 finge l'ora · ?mossa=backflip parte con una mossa · ?s=2 lo ingrandisce · ?nudo toglie lo sfondo ·
   ?statistiche=mouse (o mai) prova le statistiche del menu · ?colore=grigio (azzurro, lilla) cambia colore ·
   ?fermi tutti i terminali fermi (con ?ora=22:00 dorme) · dalla console mossa('backflip') come dal menu Mosse. */
:root {
  --s: 1;
  --w: calc(110px * var(--s));
  --h: calc(165px * var(--s));
  --pastiglia: rgba(20, 20, 24, 0.9);
  --pastiglia-testo: #E9E5DD;
  --teal: #2FA59A;
  --grigio: #A9A6A0;
  --ambra: #F7A51E;
  --arancio: #E2571A;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: transparent; overflow: hidden; user-select: none; }
body.prova { background: linear-gradient(160deg, #3D4B5C, #1E252E); }

#duck { position: fixed; right: 12px; bottom: 12px; width: var(--w); height: var(--h); touch-action: none; }
#duck.sopra { cursor: grab; }
#duck canvas { display: block; width: 100%; height: 100%; }
body.sinistra #duck { right: auto; left: 12px; }

/* La colonnina: il colpo d'occhio accanto a Microduck. Verde acqua in corso, grigio fermo. */
#colonnina { position: fixed; right: calc(20px + var(--w)); bottom: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: calc(5px * var(--s)); font: calc(11px * var(--s)) Consolas, 'Cascadia Mono', monospace; color: var(--pastiglia-testo); }
body.sinistra #colonnina { right: auto; left: calc(20px + var(--w)); align-items: flex-start; }
.pastiglia { display: flex; align-items: center; gap: 0.64em; padding: 0.36em 0.9em; border-radius: 999px; background: var(--pastiglia); white-space: nowrap; }
.pastiglia .punto { width: 0.73em; height: 0.73em; border-radius: 50%; flex: none; }
.pastiglia .barra { width: 4.9em; height: 0.46em; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; display: inline-block; }
.pastiglia .barra span { display: block; height: 100%; background: var(--teal); }
.pastiglia .barra span.piena { background: var(--ambra); }
.pastiglia.muta { color: var(--grigio); }

#nuvola { position: fixed; right: calc(16px + var(--w)); bottom: calc(12px + var(--h) * 0.42); max-width: 270px; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: #fff; color: #1B1F26; box-shadow: 0 10px 26px rgba(10, 14, 20, 0.35); display: flex; flex-direction: column; gap: 4px; }
body.sinistra #nuvola { right: auto; left: calc(16px + var(--w)); border-radius: 16px 16px 16px 4px; }
#nuvola .voce { font: 14.5px/1.35 'Segoe UI', system-ui, sans-serif; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
#nuvola .meta { font: 10.5px Consolas, monospace; color: var(--arancio); }
</style>
</head>
<body>

<div id="nuvola" hidden aria-live="polite"><div class="voce"></div><div class="meta"></div></div>
<div id="colonnina" aria-label="Terminali e PC"></div>
<div id="duck" role="img" aria-label="Microduck: clic per una battuta, tasto destro per il menu"><canvas id="c3d"></canvas></div>

<script src="node_modules/three/build/three.min.js"></script>
<script>
(function () {
  'use strict';
  const nativa = window.finestraNativa || null;
  const Q = new URLSearchParams(location.search);
  const el = (id) => document.getElementById(id);
  const riduci = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!nativa && !Q.has('nudo')) document.body.classList.add('prova');
  if (!nativa && Q.get('s')) document.documentElement.style.setProperty('--s', String(Number(Q.get('s')) || 1));

  // L'ora: ?ora=18:31 la finge, per provare le cose che succedono a orari precisi.
  function adesso() {
    const d = new Date(), o = Q.get('ora');
    if (o && /^\d{1,2}:\d{2}$/.test(o)) { const [h, m] = o.split(':'); d.setHours(Number(h), Number(m)); }
    return d;
  }

  // Nel browser di prova: tre terminali finti che cambiano stato e una CPU che va su e giù.
  let giroFinto = 0;
  const fonte = nativa || {
    stato: () => {
      // ?fermi: tutti fermi, per provare il sonno della sera (?ora=22:00&fermi)
      const g = ++giroFinto, st = (n) => (!Q.has('fermi') && (g + n) % 7 < 3 ? 'in corso' : 'fermo');
      return Promise.resolve({ ok: true, terminali: [{ nome: 'hugo-64', stato: st(0) }, { nome: 'schevo-5f', stato: st(2) }, { nome: 'source-e1', stato: st(4) }],
        macchina: { cpu: Math.round(45 + 40 * Math.sin(g / 3)), ram_totale: 16 * 2 ** 30, ram_usata: 13 * 2 ** 30, disco_totale: 475 * 2 ** 30, disco_usato: 250 * 2 ** 30 } });
    },
  };

  // ======================================================================================================
  // Il modello 3D: dall'artefatto "Microduck 3D" (Three.js r128), pezzo per pezzo dalle foto del robot vero.
  // ======================================================================================================
  const canvas = el('c3d');
  let renderer;
  try {
    if (!window.THREE) throw new Error('three');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) {
    // ponytail: senza WebGL niente papero, solo la colonnina; un disegno piatto di riserva se mai servirà.
    el('duck').hidden = true;
    renderer = null;
  }

  const S = { modo: 'idle', modoFino: 0, mossa: null, giro: null, spin: 0, parlaFino: 0, px: 0, py: 0, pt: -9, hy: 0, hp: 0, hr: 0, jaw: 0, eye: 1, neck: 0.1, dorme: false, seduto: 0, sonno: 0, dopo: null, sveglio: false, sinistra: false };
  let scene, cam, aggiorna = () => {}, toccaPapero = () => false, colora = () => {};

  if (renderer) (function () {
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);

    const col = (h) => new THREE.Color(h).convertSRGBToLinear();
    const mat = (h, o) => new THREE.MeshStandardMaterial(Object.assign({ color: col(h), roughness: 0.55, metalness: 0 }, o || {}));
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    function mesh(g, m, x, y, z) { const o = new THREE.Mesh(g, m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = true; o.receiveShadow = true; return o; }
    function rrShape(w, h, r) {
      r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001);
      const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    function rbox(w, h, d, b, cr) {
      b = b == null ? 0.012 : b;
      const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * b, h - 2 * b, cr || 0.01), { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
      g.translate(0, 0, -(d - 2 * b) / 2);
      return g;
    }
    function slab(w, len, th, cr) { const g = rbox(w, len, th, 0.012, cr); g.rotateX(-Math.PI / 2); return g; }
    function polyShape(pts, r) {
      const s = new THREE.Shape(), n = pts.length;
      for (let i = 0; i < n; i++) {
        const p = pts[i], a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
        const va = [a[0] - p[0], a[1] - p[1]], vb = [b[0] - p[0], b[1] - p[1]];
        const la = Math.hypot(va[0], va[1]), lb = Math.hypot(vb[0], vb[1]), ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
        const p1 = [p[0] + va[0] / la * ra, p[1] + va[1] / la * ra], p2 = [p[0] + vb[0] / lb * rb, p[1] + vb[1] / lb * rb];
        if (i === 0) s.moveTo(p1[0], p1[1]); else s.lineTo(p1[0], p1[1]);
        s.quadraticCurveTo(p[0], p[1], p2[0], p2[1]);
      }
      s.closePath();
      return s;
    }
    function extrudeZY(pts, width, r, b) {
      const g = new THREE.ExtrudeGeometry(polyShape(pts, r), { depth: width - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
      g.translate(0, 0, -(width - 2 * b) / 2);
      g.rotateY(-Math.PI / 2);
      return g;
    }
    function cylX(r, len) { const g = new THREE.CylinderGeometry(r, r, len, 32); g.rotateZ(Math.PI / 2); return g; }
    function cylZ(r, len) { const g = new THREE.CylinderGeometry(r, r, len, 48); g.rotateX(Math.PI / 2); return g; }
    function superquad(a, b, c, k) {
      const g = new THREE.SphereGeometry(1, 96, 64);
      g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 2);
      const p = g.attributes.position, pw = (v) => Math.sign(v) * Math.pow(Math.abs(v), k);
      for (let i = 0; i < p.count; i++) p.setXYZ(i, pw(p.getX(i)) * a, pw(p.getY(i)) * b, pw(p.getZ(i)) * c);
      g.computeVertexNormals();
      return g;
    }
    function grid(nu, nv, f) {
      const pos = [], idx = [];
      for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) { const p = f(i / nu, j / nv); pos.push(p[0], p[1], p[2]); }
      for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
        const a = i * (nv + 1) + j, b = a + 1, c = a + nv + 1, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx); g.computeVertexNormals();
      return g;
    }

    // L'etichetta su ogni servo: chiara, con qualche riga stampata.
    const etichetta = (function () {
      const c = document.createElement('canvas'); c.width = 128; c.height = 96;
      const x = c.getContext('2d');
      x.fillStyle = '#E4E3DE'; x.fillRect(0, 0, 128, 96);
      x.fillStyle = '#2A2B2E'; x.fillRect(10, 12, 70, 12); x.fillRect(10, 34, 108, 5); x.fillRect(10, 46, 84, 5);
      for (let i = 0; i < 18; i++) x.fillRect(10 + i * 6, 62, i % 3 ? 2 : 4, 22);
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
    })();
    // Colori "Bianco e arancio", quelli del robot vero.
    const M = {
      shell: mat('#F2F0EB', { side: THREE.DoubleSide }), face: mat('#BDBBB6', { side: THREE.DoubleSide, roughness: 0.8 }), cable: mat('#141416', { roughness: 0.42 }),
      body: mat('#F2F0EB'), beak: mat('#F2671D', { roughness: 0.4 }), ring: mat('#F7A51E', { roughness: 0.3, side: THREE.DoubleSide }),
      footTop: mat('#F2671D', { roughness: 0.4 }), sole: mat('#F7A51E', { roughness: 0.58 }),
      servo: mat('#17181B', { roughness: 0.46 }), metal: mat('#B9BEC6', { roughness: 0.35, metalness: 0.35 }),
      label: new THREE.MeshStandardMaterial({ map: etichetta, roughness: 0.7 }), dark: mat('#0B0C0E', { roughness: 0.35 }),
      screw: mat('#3A3D43', { roughness: 0.4, metalness: 0.3 }),
      glass: mat('#07080A', { roughness: 0.06, metalness: 0.3 }), glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      coat: mat('#3A2C78', { roughness: 0.3 }),
    };

    // Proporzioni dalle foto: testa lunga a pagnotta che sporge oltre le punte dei piedi, collo davanti a un
    // corpo che va indietro, gambe da uccello (ginocchio dietro, stinco in avanti).
    scene = new THREE.Scene();
    const root = new THREE.Group(); scene.add(root);
    const pelvis = new THREE.Group(); root.add(pelvis);
    const L1 = 0.40, L2 = 0.44, AH = 0.17, H0 = 0.75, K0 = -1.25;
    pelvis.position.y = L1 * Math.cos(H0) + L2 * Math.cos(H0 + K0) + AH;
    function holes(parent, list, r, m) { list.forEach((p) => parent.add(mesh(cylX(r, 0.012), m || M.screw, p[0], p[1], p[2]))); }

    // anche: un servo largo con due staffe a U argentate
    pelvis.add(mesh(rbox(0.52, 0.16, 0.30), M.servo, 0, 0, -0.02));
    [-1, 1].forEach((s) => {
      pelvis.add(mesh(rbox(0.15, 0.11, 0.07, 0.01, 0.03), M.metal, s * 0.13, 0, 0.13));
      pelvis.add(mesh(cylZ(0.03, 0.02), M.servo, s * 0.13, 0, 0.165));
      pelvis.add(mesh(cylZ(0.012, 0.024), M.metal, s * 0.13, 0, 0.165));
    });
    // corpo: un blocco arrotondato, più profondo che alto, con la linea dello stampo
    const BC = [0, 0.27, -0.10], BS = [0.31, 0.185, 0.34], BK = 0.5;
    pelvis.add(mesh(superquad(BS[0], BS[1], BS[2], BK), M.body, BC[0], BC[1], BC[2]));
    const seamPts = [];
    for (let si = 0; si <= 96; si++) {
      const sa = si / 96 * Math.PI * 2, cs = Math.cos(sa), sn = Math.sin(sa);
      seamPts.push(new THREE.Vector3(0, Math.sign(sn) * Math.pow(Math.abs(sn), BK) * BS[1] * 1.004, Math.sign(cs) * Math.pow(Math.abs(cs), BK) * BS[2] * 1.004));
    }
    const seam = new THREE.Line(new THREE.BufferGeometry().setFromPoints(seamPts), new THREE.LineBasicMaterial({ color: col('#F2F0EB').multiplyScalar(0.5) }));
    seam.position.set(BC[0], BC[1], BC[2]); pelvis.add(seam);

    // collo: due servi impilati, staffe laterali coi fori, cavi fino alla testa
    const neck = new THREE.Group(); neck.position.set(0, 0.34, 0.22); pelvis.add(neck);
    const NL = 0.50;
    neck.add(mesh(rbox(0.2, 0.24, 0.24), M.servo, 0, 0.12, 0));
    neck.add(mesh(rbox(0.2, 0.24, 0.24), M.servo, 0, 0.375, 0));
    neck.add(mesh(new THREE.PlaneGeometry(0.05, 0.07), M.label, -0.045, 0.14, 0.1215));
    neck.add(mesh(new THREE.PlaneGeometry(0.05, 0.07), M.label, -0.045, 0.39, 0.1215));
    [-1, 1].forEach((s) => {
      neck.add(mesh(extrudeZY([[-0.07, 0.15], [0.07, 0.15], [0.07, 0.33], [-0.07, 0.33]], 0.014, 0.03, 0.004), M.metal, s * 0.108, 0, 0.01));
      holes(neck, [[s * 0.115, 0.19, -0.02], [s * 0.115, 0.19, 0.04], [s * 0.115, 0.29, -0.02], [s * 0.115, 0.29, 0.04]], 0.011);
      neck.add(mesh(cylX(0.034, 0.02), M.metal, s * 0.112, 0.46, 0.0));
      neck.add(mesh(extrudeZY([[-0.16, -0.01], [0.02, -0.01], [0.05, 0.10], [-0.10, 0.13]], 0.02, 0.04, 0.005), M.body, s * 0.118, 0, 0));
      holes(neck, [[s * 0.128, 0.03, -0.09], [s * 0.128, 0.03, -0.02], [s * 0.128, 0.09, -0.06], [s * 0.128, 0.085, 0.01]], 0.01);
    });
    function cable(pts, r) {
      const c = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
      return mesh(new THREE.TubeGeometry(c, 40, r, 8, false), M.cable);
    }
    neck.add(cable([[0.06, 0.10, -0.12], [0.10, 0.22, -0.22], [0.08, 0.40, -0.24], [0.05, NL + 0.03, -0.17]], 0.011));
    neck.add(cable([[-0.05, 0.30, -0.12], [-0.10, 0.36, -0.20], [-0.07, 0.47, -0.21], [-0.04, NL + 0.03, -0.14]], 0.009));
    neck.add(cable([[0.0, 0.02, -0.12], [0.03, -0.02, -0.2], [0.02, -0.07, -0.16]], 0.011));

    // testa: un arco tirato da davanti a dietro. Sopra piatta, dietro tonda, davanti aperta con la faccia incassata.
    const head = new THREE.Group(); head.position.set(0, NL, 0); neck.add(head);
    const Wd = 0.43, HH = 0.50, HL = 1.30, HB = 0.105, ZF = 0.81, TH = 0.035, REC = 0.11, EX = 2 / 2.35;
    const arch = (v, w, h) => { const a = Math.PI * v, c = Math.cos(a), s = Math.sin(a); return [w * Math.sign(c) * Math.pow(Math.abs(c), EX), h * Math.pow(Math.max(0, s), EX)]; };
    const hp = (u) => (u < 0.5 ? 1 : Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.5) / 0.5, 2.4))));
    const wp = (u) => (u < 0.5 ? 1 : 1 - 0.14 * Math.pow((u - 0.5) / 0.5, 2));
    head.add(mesh(grid(64, 56, (s, v) => { const u = 1 - Math.pow(1 - s, 1.7), a = arch(v, Wd * wp(u), HH * hp(u)); return [a[0], HB + a[1], ZF - u * HL]; }), M.shell));
    head.add(mesh(grid(2, 56, (u, v) => { const a = arch(v, Wd - TH * u, HH - TH * u); return [a[0], HB + a[1], ZF]; }), M.shell));
    head.add(mesh(grid(4, 56, (u, v) => { const a = arch(v, Wd - TH, HH - TH); return [a[0], HB + a[1], ZF - REC * u]; }), M.shell));
    head.add(mesh(grid(10, 56, (s, v) => { const a = arch(v, (Wd - TH) * s, (HH - TH) * s); return [a[0], HB + a[1], ZF - REC]; }), M.face));
    // becco: la lastra di sopra corre sotto tutta la testa e sporge davanti; quella di sotto è incernierata
    head.add(mesh(slab(0.875, 1.40, 0.06, 0.1), M.beak, 0, HB - 0.03, 0.20));
    head.add(mesh(slab(0.80, 0.42, 0.045, 0.06), M.beak, 0, 0.022, -0.30));
    const jaw = new THREE.Group(); jaw.position.set(0, 0.045, -0.11); head.add(jaw);
    jaw.add(mesh(slab(0.86, 1.02, 0.035, 0.1), M.beak, 0, -0.0175, 0.49));
    jaw.add(mesh(slab(0.78, 0.9, 0.01, 0.08), M.dark, 0, 0.002, 0.5));
    [-1, 1].forEach((s) => {
      head.add(mesh(extrudeZY([[-0.27, HB - 0.06], [0.05, HB - 0.06], [-0.10, HB + 0.17]], 0.03, 0.04, 0.008), M.beak, s * (Wd + 0.008), 0, 0));
      holes(head, [[s * (Wd + 0.024), HB - 0.02, -0.17], [s * (Wd + 0.024), HB - 0.02, -0.04], [s * (Wd + 0.024), HB + 0.08, -0.105]], 0.013);
    });
    // occhio: un anello spesso con la fotocamera dentro, fuori centro come quello vero; accanto un sensore
    const eye = new THREE.Group(); eye.position.set(-0.10, HB + 0.25, ZF - REC); head.add(eye);
    const ringG = new THREE.LatheGeometry([[0.135, 0], [0.135, 0.105], [0.127, 0.124], [0.112, 0.132], [0.094, 0.132], [0.081, 0.124], [0.076, 0.105], [0.076, 0.03]].map((p) => new THREE.Vector2(p[0], p[1])), 56);
    ringG.rotateX(Math.PI / 2);
    eye.add(mesh(ringG, M.ring));
    const lens = new THREE.Group(); eye.add(lens);
    lens.add(mesh(cylZ(0.075, 0.07), M.dark, 0, 0, 0.035));
    lens.add(mesh(new THREE.TorusGeometry(0.058, 0.012, 10, 40), M.servo, 0, 0, 0.072));
    const glass = mesh(new THREE.SphereGeometry(0.05, 32, 16), M.glass, 0, 0, 0.07); glass.scale.z = 0.5; lens.add(glass);
    lens.add(mesh(new THREE.TorusGeometry(0.036, 0.006, 8, 40), M.coat, 0, 0, 0.074));
    lens.add(mesh(new THREE.SphereGeometry(0.011, 12, 8), M.glint, -0.018, 0.02, 0.092));
    head.add(mesh(rbox(0.075, 0.036, 0.02, 0.006, 0.014), M.dark, 0.17, HB + 0.25, ZF - REC + 0.008));
    head.add(mesh(rbox(0.17, 0.05, 0.22), M.metal, 0, 0.0, 0.01));

    // gambe: servo dell'anca, coscia con la copertura bianca, due barre fino al servo della caviglia, piede bicolore
    function gamba(side) {
      const g = new THREE.Group(); g.position.set(side * 0.31, 0, -0.02); g.scale.x = side;
      g.add(mesh(rbox(0.17, 0.2, 0.24), M.servo));
      const thigh = new THREE.Group(); g.add(thigh);
      thigh.add(mesh(rbox(0.17, L1, 0.16), M.servo, 0, -L1 / 2, 0));
      const cover = mesh(extrudeZY([[0.16, 0.11], [-0.17, 0.09], [-0.20, -L1 + 0.02], [-0.06, -L1 - 0.10], [0.10, -L1 + 0.10]], 0.045, 0.07, 0.012), M.body, 0.105, 0, 0);
      thigh.add(cover);
      cover.add(mesh(cylX(0.013, 0.012), M.screw, 0.021, 0.03, -0.10)); cover.add(mesh(cylX(0.013, 0.012), M.screw, 0.021, -L1, -0.04));

  const CHIACCHIERE = { tante: [2, 5], poche: [10, 20], niente: null }; // minuti fra una battuta e l'altra
  let livello = 'tante', zittoFino = 0, battuta = null, ultimaBattuta = 0, prossimaBattuta = Date.now() + 4 * 60000, eventi = [], primaMappa = null, perNome = {};
  const leggiLs = (k, d) => { try { return window.localStorage.getItem(k) || d; } catch (e) { return d; } };
  const scriviLs = (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) { /* è una comodità */ } };
  const chiaveGiorno = () => 'microduck.dette.' + adesso().toISOString().slice(0, 10);
  const riempi = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v[k] != null ? String(v[k]) : ''));

  function vociDelMomento() {
    const { t, lav, fer } = conti(), m = (stato && stato.macchina) || {}, d = adesso(), h = d.getHours() + d.getMinutes() / 60, g = d.getDay();
    const v = { tot: t.length, lav: lav.length, fer: fer.length, nomeLav: (lav[0] || {}).nome, nomeFer: (fer[0] || {}).nome, cpu: m.cpu,
      ram: m.ram_totale ? Math.round(100 * m.ram_usata / m.ram_totale) : 0, disco: m.disco_totale ? Math.round(100 * m.disco_usato / m.disco_totale) : 0,
      libero: m.disco_totale ? gib(m.disco_totale - m.disco_usato) : 0, ora: d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) };
    const c = [];
    if (!t.length) c.push(['nessuno', 3]);
    else if (!lav.length) c.push(['calma', 2]);
    else c.push([lav.length >= 3 ? 'tanti' : 'lavoro', 3]);
    if (fer.length >= 2 && lav.length) c.push(['fermi', 1]);
    if (v.cpu >= 80) c.push(['cpuAlta', 4]); else if (m.cpu != null && v.cpu < 10) c.push(['cpuBassa', 1]);
    if (v.ram >= 80) c.push(['ramAlta', 2]);
    if (v.disco >= 85) c.push(['discoAlto', 2]); else if (v.libero) c.push(['disco', 0.5]);
    if (h >= 7 && h < 10.5) c.push(['mattina', 2]);
    if (h >= 12.5 && h < 14) c.push(['pranzo', 3]);
    if (h >= 15.5 && h < 17) c.push(['pomeriggio', 1]);
    if (h >= 19 && h < 23) c.push(['sera', 2]);
    if (g === 5 && h >= 15) c.push(['venerdi', 2]);
    if (g === 1 && h < 11) c.push(['lunedi', 2]);
    c.push(['generiche', 4]);
    return c.map((x) => [x[0], v, x[1]]);
  }

  // Sceglie fra le categorie del momento (pesate), saltando le frasi già dette oggi.
  function scegliBattuta(candidate, giro) {
    let gia; try { gia = JSON.parse(leggiLs(chiaveGiorno(), '[]')); } catch (e) { gia = []; }
    const possibili = [];
    candidate.forEach(([cat, v, peso]) => (BATTUTE[cat] || []).forEach((t, i) => {
      if (gia.indexOf(cat + i) < 0) possibili.push({ id: cat + i, testo: riempi(t, v), peso: peso / BATTUTE[cat].length });
    }));
    if (!possibili.length) { scriviLs(chiaveGiorno(), '[]'); return giro ? null : scegliBattuta(candidate, true); }
    let r = Math.random() * possibili.reduce((a, p) => a + p.peso, 0);
    const p = possibili.find((x) => (r -= x.peso) <= 0) || possibili[possibili.length - 1];
    gia.push(p.id);
    scriviLs(chiaveGiorno(), JSON.stringify(gia));
    return p.testo;
  }

  function puoParlare() {
    return CHIACCHIERE[livello] != null && Date.now() >= zittoFino && !document.hidden && !(battuta && Date.now() < battuta.fino);
  }

  // La nuvoletta: compare accanto a lui, la colonnina si nasconde, e la finestra si allarga quanto serve.
  function dici(testo) {
    if (!testo) return;
    const durata = Math.min(12000, 5000 + 45 * testo.length);
    battuta = { testo, fino: Date.now() + durata };
    ultimaBattuta = Date.now();
    S.parlaFino = Date.now() + Math.max(1500, Math.min(5000, testo.length * 55));
    el('nuvola').querySelector('.voce').textContent = testo;
    el('nuvola').querySelector('.meta').textContent = 'Microduck · ' + adesso().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    el('nuvola').hidden = false;
    if (nativa) nativa.modo('nuvola');
    disegnaColonnina();
    setTimeout(() => {
      if (battuta && Date.now() < battuta.fino - 50) return; // nel frattempo ne è partita un'altra
      el('nuvola').hidden = true;
      if (nativa) nativa.modo('mini');
      disegnaColonnina();
    }, durata);
  }

  // Cosa è cambiato fra una lettura e l'altra: chi è nato, chi ha finito, chi è ripartito, chi se n'è andato.
  function rilevaEventi() {
    const ora = {};
    conti().t.forEach((x) => { ora[x.nome] = x.stato; });
    const t = Date.now();
    const aggiungi = (cat, nome) => {
      if (t - (perNome[nome] || 0) < 10 * 60000) return;
      perNome[nome] = t;
      eventi.push({ cat, nome, quando: t });
    };
    if (primaMappa) {
      Object.keys(ora).forEach((n) => {
        const p = primaMappa[n], s = ora[n];
        if (p == null) aggiungi('nato', n);
        else if (p === 'in corso' && s !== 'in corso') aggiungi('finito', n);
        else if (p !== 'in corso' && s === 'in corso') aggiungi('riparte', n);
      });
      Object.keys(primaMappa).forEach((n) => { if (!(n in ora)) aggiungi('andato', n); });
      const lavPrima = Object.values(primaMappa).filter((s) => s === 'in corso').length;
      const lavOra = Object.values(ora).filter((s) => s === 'in corso').length;
      if (lavPrima > 0 && lavOra === 0 && Object.keys(ora).length) { eventi = [{ cat: 'festa', nome: '', quando: t }]; }
    }
    // La sera, con nessuno in corso, si appisola; si sveglia appena uno riparte.
    const h = adesso().getHours();
    const lav = Object.keys(ora).filter((n) => ora[n] === 'in corso');
    const dorme = (h >= 20 || h < 7) && lav.length === 0;
    if (dorme !== S.dorme && primaMappa) {
      S.dorme = dorme;
      eventi = [];
      if (puoParlare()) dici(riempi(scegli(BATTUTE[dorme ? 'siAppisola' : 'siSveglia']), { nome: lav[0] || 'qualcuno' }));
      if (!dorme) fai('saltello');
    } else S.dorme = dorme;
    primaMappa = ora;
    eventi = eventi.filter((e) => t - e.quando < 10 * 60000).slice(-3);
  }

  const MOSSA_DI = { finito: 'saltello', festa: 'backflip', nato: 'gira', riparte: 'saltello' };
  function forseParla() {
    if (!stato || !puoParlare()) return;
    const t = Date.now();
    if (eventi.length && t - ultimaBattuta > 60000 && !S.dorme) {
      const e = eventi.shift();
      dici(riempi(scegli(BATTUTE[e.cat]), { nome: e.nome }));
      if (MOSSA_DI[e.cat] && !riduci) fai(MOSSA_DI[e.cat]);
      return;
    }
    if (t < prossimaBattuta) return;
    const span = CHIACCHIERE[livello];
    prossimaBattuta = t + caso(span[0], span[1]) * 60000 * (S.dorme ? 3 : 1);
    dici(scegliBattuta(S.dorme ? [['notte', { tot: conti().t.length }, 1]] : vociDelMomento()));
  }

  function leggiStato() {
    fonte.stato().then((s) => { stato = s && s.ok ? s : null; }, () => { stato = null; }).then(() => {
      if (stato) rilevaEventi();
      disegnaColonnina();
      const { lav, fer } = conti();
      if (nativa) nativa.conta({ lav: lav.length, fer: fer.length });
    });
  }

  // ======================================================================================================
  // Mouse: le zone trasparenti lasciano passare i clic, Microduck si trascina, il muso segue il puntatore.
  // ======================================================================================================
  let soppressoClic = false, dentroPrima = null, inizio = null, trascina = false;
  // Il muso segue il puntatore: nella finestra vera la posizione arriva da main.js per tutto lo schermo;
  // lontano dal papero lo sguardo si satura (a 300 px è a metà corsa) invece di bloccarsi di colpo.
  const guardaVerso = (dx, dy) => {
    S.px = dx / (Math.abs(dx) + 300);
    S.py = dy / (Math.abs(dy) + 300);
    S.pt = performance.now() / 1000;
  };
  if (!nativa) document.addEventListener('mousemove', (e) => {
    const r = el('duck').getBoundingClientRect();
    guardaVerso(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height * 0.45));
  });
  // Statistiche "solo col mouse sopra di lui": compaiono passando su Microduck, restano finché il mouse è su di
  // lui o sulla colonnina (così si leggono i nomi dei terminali) e spariscono un secondo e mezzo dopo.
  function vicino(si) {
    if (si) {
      clearTimeout(viaTimer); viaTimer = null;
      if (!mouseVicino) { mouseVicino = true; disegnaColonnina(); }
    } else if (mouseVicino && !viaTimer) {
      viaTimer = setTimeout(() => { mouseVicino = false; viaTimer = null; disegnaColonnina(); }, 1500);
    }
  }
  document.addEventListener('mouseleave', () => vicino(false));
  // Le zone trasparenti lasciano passare i clic: sul papero conta il disegno, non il suo riquadro (14 nov,
  // Alex: intorno a lui non si cliccava sotto).
  document.addEventListener('mousemove', (e) => {
    if (inizio) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const sulPapero = !!(t && t.closest('#duck')) && toccaPapero(e.clientX, e.clientY);
    el('duck').classList.toggle('sopra', sulPapero);
    vicino(sulPapero || !!(t && t.closest('#colonnina:not([hidden])')));
    if (!nativa) return;
    const dentro = sulPapero || !!(t && t.closest('#nuvola:not([hidden]), #colonnina:not([hidden])'));
    if (dentro !== dentroPrima) { dentroPrima = dentro; nativa.mouse(dentro); }
  });
  if (nativa) {
    nativa.suCursore((c) => guardaVerso(Number(c.dx) || 0, Number(c.dy) || 0));
    nativa.suColonnina((m) => { modoColonnina = m; disegnaColonnina(); });
    nativa.suColore((k) => colora(k));
    nativa.suMossa(richiedi);
    document.addEventListener('mouseleave', () => { dentroPrima = false; nativa.mouse(false); });
    nativa.suLato((l) => { S.sinistra = l === 'sinistra'; document.body.classList.toggle('sinistra', S.sinistra); });
    nativa.suScala((s) => document.documentElement.style.setProperty('--s', String(s)));
    nativa.suChiacchiere((c) => {
      if (c.livello in CHIACCHIERE) livello = c.livello;
      zittoFino = Number(c.zittoFino) || 0;
      if (CHIACCHIERE[livello]) prossimaBattuta = Math.min(prossimaBattuta, Date.now() + CHIACCHIERE[livello][1] * 60000);
    });
    el('duck').addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      nativa.grandezza(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
    const finisci = () => {
      if (trascina) { nativa.trascinaFine(); soppressoClic = true; }
      inizio = null; trascina = false;
    };
    el('duck').addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      inizio = { x: e.screenX, y: e.screenY }; trascina = false;
      el('duck').setPointerCapture(e.pointerId);
    });
    el('duck').addEventListener('pointermove', (e) => {
      if (!inizio) return;
      if ((e.buttons & 1) === 0) { finisci(); return; }
      const dx = e.screenX - inizio.x, dy = e.screenY - inizio.y;
      if (!trascina && Math.abs(dx) + Math.abs(dy) > 5) { trascina = true; nativa.trascinaInizio(); }
      if (trascina) nativa.sposta(dx, dy);
    });
    el('duck').addEventListener('pointerup', finisci);
    el('duck').addEventListener('pointercancel', finisci);
    el('duck').addEventListener('lostpointercapture', finisci);
    el('duck').addEventListener('contextmenu', (e) => { e.preventDefault(); nativa.menu(); });
  }
  // Clic: una battuta subito (anche se le chiacchiere sono a "niente": l'hai chiesta tu).
  el('duck').addEventListener('click', () => {
    if (soppressoClic) { soppressoClic = false; return; }
    if (!el('duck').classList.contains('sopra')) return; // clic nel vuoto intorno a lui
    battuta = null;
    dici(scegliBattuta(S.dorme ? [['notte', { tot: conti().t.length }, 1]] : vociDelMomento()));
    if (!riduci && !S.dorme) fai('saltello');
  });

  leggiStato();
  setInterval(leggiStato, 5000);
  setInterval(forseParla, 10000);
  setInterval(forseMossa, 2000);
  battito();
  if (Q.get('mossa')) fai(Q.get('mossa'));
  if (!nativa && Q.get('colore')) colora(Q.get('colore'));
  if (!nativa) window.mossa = richiedi; // nel browser di prova, dalla console: mossa('backflip')
  setTimeout(() => { if (puoParlare()) dici(scegli(BATTUTE.avvio)); }, 3000);
})();
</script>
</body>
</html>
